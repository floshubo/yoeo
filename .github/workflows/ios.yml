name: iOS build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', 'public/**', 'package.json', 'pnpm-lock.yaml', 'scripts/prepare-ios.mjs', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'src/**', 'public/**', 'package.json', 'pnpm-lock.yaml', 'scripts/prepare-ios.mjs', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build && pnpm exec cap sync ios
      - run: plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy
      - name: Build iPhone and iPad simulator app (not an installable App Store binary)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath output/ios-simulator CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: YOEO-iOS-simulator
          path: output/ios-simulator/Build/Products/Release-iphonesimulator/App.app
          retention-days: 7
